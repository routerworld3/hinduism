# ---------------------------------------------------------------------------
# MkDocs Material configuration
# Docs: https://squidfunk.github.io/mkdocs-material/
#
# ---------------------------------------------------------------------------

site_name: hinduism
site_description: Notes, references and diagrams
site_url: https://routerworld3.github.io/hinduism/
repo_url: https://github.com/routerworld3/hinduism
repo_name: routerworld3/hinduism
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant        # SPA-style page loads
    - navigation.instant.progress
    - navigation.tracking       # URL updates with the active anchor
    - navigation.sections       # top-level folders render as sections
    - navigation.top            # back-to-top button
    - navigation.footer         # prev/next links
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit       # "Edit this page" -> GitHub
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # This block is what makes ```mermaid fences render as diagrams.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# ---------------------------------------------------------------------------
# Navigation
#
# Keep this order aligned with the sections and cards in docs/index.md.
# Paths are relative to docs_dir; do not prefix them with docs/.
# ---------------------------------------------------------------------------

nav:
  - Home: index.md
  - Foundations:
      - Timeline of Hindu texts: hindu-text-timeline.md
      - Monotheism and divine forms: monotheism-and-divine-forms.md
  - Schools of Vedānta:
      - Compare the schools: hindu-philosophy-schools.md
      - Shankaracharya — Advaita: adi-shankaracharya.md
      - Ramanujacharya — Viśiṣṭādvaita: ramanujacharya.md
      - Madhvacharya — Dvaita: madhavcharya.md
      - Chaitanya — Achintya Bhedābheda and ISKCON: chaitanya-mahaprabhu-and-iskcon.md
  - Bhakti and Sant traditions:
      - Kabir Panth and RamKabir — Jivanji Maharaj: kabir-panth-and-ramkabir-parampara.md
  - Modern traditions:
      - Swaminarayan philosophy: swaminarayan-philosophy.md
      - Dada Bhagwan and Akram Vignan: dada-bhagwan-akram-vignan.md
  - Stories and cosmology:
      - Brahmā, Viṣṇu, and Śiva: brahma-vishnu-shiva-stories.md
